# Remote agent access:
# Cloudflare Tunnel -> JWT-validating gateway -> host-side TradingView MCP HTTP server.
# The shared tunnel origin should target http://tradingview-gateway:8080 on the edge network.
# The host MCP remains bound to 127.0.0.1:8765; no host port is published by this compose file.
name: tradingview-mcp-public

services:
  gateway:
    # Reviewed local gateway runtime; never pull this local-only tag from a registry.
    image: dockerlocal-gateway:node-26.13.1-r1
    pull_policy: never
    container_name: dtv-mcp-gateway
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file: public/gateway.env
    environment:
      UPSTREAM_HOST: host.docker.internal
      UPSTREAM_PORT: "8765"
      UPSTREAM_PATH: /mcp
      UPSTREAM_HOST_HEADER: localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./public/gateway:/app:ro
    networks:
      edge:
        aliases:
          - tradingview-gateway
          - tradingview-mcp-gateway
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Docker Desktop relays host.docker.internal to the host's 127.0.0.1, so without this
  # every container could attach to TradingView's unauthenticated CDP port and bypass the MCP.
  cdp-guard:
    build:
      dockerfile_inline: |
        FROM node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
        # The guard only uses shell utilities and iptables, not npm or Node applications.
        RUN apk upgrade --no-cache \
          && apk add --no-cache iptables \
          && rm -rf /usr/local/lib/node_modules/npm /usr/local/bin/npm /usr/local/bin/npx \
          && command -v iptables \
          && command -v getent \
          && test ! -e /usr/local/lib/node_modules/npm
    image: dtv-cdp-guard:local
    container_name: dtv-cdp-guard
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    read_only: true
    tmpfs: [/run]
    security_opt:
      - no-new-privileges:true
    environment:
      CDP_PORT: "9222"
    entrypoint: ["/bin/sh", "-c"]
    # Re-checks every 15s because Docker Desktop can rewrite DOCKER-USER after network changes.
    command:
      - |
        set -u
        while :; do
          HOST_IP=$$(getent ahostsv4 host.docker.internal | awk 'NR==1{print $$1}')
          if [ -z "$$HOST_IP" ]; then echo "host.docker.internal unresolved" >&2; sleep 5; continue; fi
          echo "$$HOST_IP" > /run/host_ip
          for chain in DOCKER-USER OUTPUT; do
            iptables -C $$chain -d $$HOST_IP -p tcp --dport $$CDP_PORT -j REJECT --reject-with tcp-reset 2>/dev/null \
              || { iptables -I $$chain 1 -d $$HOST_IP -p tcp --dport $$CDP_PORT -j REJECT --reject-with tcp-reset \
                   && echo "blocked $$HOST_IP:$$CDP_PORT in $$chain"; }
          done
          sleep 15
        done
    healthcheck:
      test: ["CMD-SHELL", "ip=$$(cat /run/host_ip) && for c in DOCKER-USER OUTPUT; do iptables -C $$c -d $$ip -p tcp --dport $$CDP_PORT -j REJECT --reject-with tcp-reset || exit 1; done"]
      interval: 30s
      start_period: 20s
    restart: unless-stopped

networks:
  edge:
    driver: bridge
