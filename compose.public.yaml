# Remote agent access:
# Cloudflare Tunnel -> JWT-validating gateway -> host-side TradingView MCP HTTP server.
# The shared tunnel origin should target http://tradingview-gateway:8080 on the edge network.
# The host MCP remains bound to 127.0.0.1:8765; no host port is published by this compose file.
name: tradingview-mcp-public

services:
  gateway:
    image: node:26.9.0-alpine
    container_name: tradingview-mcp-gateway
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file: public/gateway.env
    environment:
      UPSTREAM_HOST: host.docker.internal
      UPSTREAM_PORT: "8765"
      UPSTREAM_PATH: /mcp
      UPSTREAM_HOST_HEADER: localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./public/gateway:/app:ro
    networks:
      edge:
        aliases:
          - tradingview-gateway
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  edge:
    driver: bridge
