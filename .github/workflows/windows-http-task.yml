name: Windows HTTP Task validation

on:
  pull_request:
    paths:
      - 'scripts/windows/install-managed-http-task.ps1'
      - 'scripts/windows/http-managed.js'
      - '.github/workflows/windows-http-task.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/windows/install-managed-http-task.ps1'
      - 'scripts/windows/http-managed.js'

permissions:
  contents: read

jobs:
  parse-windows-task-migration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Parse PowerShell migration, without executing any scheduled tasks
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $PWD 'scripts/windows/install-managed-http-task.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object { $_.Message } | Out-String)
          }
          Write-Host 'PowerShell migration parses successfully.'
