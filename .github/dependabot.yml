version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      compose-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    groups:
      security-minor-patch:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      codeql-actions:
        applies-to: "version-updates"
        patterns:
          - "github/codeql-action/*"
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action/*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
